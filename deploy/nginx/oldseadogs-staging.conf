# OldSeaDogs staging reverse proxy for DigitalOcean.
# Install only after a staging domain has been chosen. Do not use this for oldseadogs.com cutover.

server {
    listen 80;
    listen [::]:80;
    server_name staging.oldseadogs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.oldseadogs.com;

    ssl_certificate /etc/letsencrypt/live/staging.oldseadogs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.oldseadogs.com/privkey.pem;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location ~ /\. {
        deny all;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=604800";
    }

    # Protect the editor root and its descendants without catching public
    # routes such as /editorial-standards.
    location ~ ^/editor(?:/|$) {
        auth_basic "OldSeaDogs editor";
        auth_basic_user_file /etc/nginx/oldseadogs.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header oai-authenticated-user-email "captainoldseadog@gmail.com";
        proxy_set_header x-openai-authenticated-user-email "captainoldseadog@gmail.com";
    }

    location ~ ^/api/editor(?:/|$) {
        auth_basic "OldSeaDogs editor";
        auth_basic_user_file /etc/nginx/oldseadogs.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header oai-authenticated-user-email "captainoldseadog@gmail.com";
        proxy_set_header x-openai-authenticated-user-email "captainoldseadog@gmail.com";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header x-openai-authenticated-user-email "";
    }
}
